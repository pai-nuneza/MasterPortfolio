<div class="container mt-4">
  <h2>Todo List</h2>

  <!-- Tasks section -->
  <div class="input-group mb-3">
    <input type="text" class="form-control" placeholder="Enter a task" [(ngModel)]="newTask">
    <button class="btn btn-primary" (click)="addTask()">Add</button>
  </div>

  <ul class="list-group">
    <li *ngFor="let task of tasks" class="list-group-item d-flex justify-content-between align-items-center">
      {{ task }}
      <div>
        <button class="btn btn-success me-2" (click)="completeTask(task)">Complete</button>
        <button class="btn btn-danger" (click)="deleteTask(task)">Delete</button>
      </div>
    </li>
  </ul>

  <!-- Completed tasks section -->
  <h2>Completed Tasks</h2>

  <ul class="list-group">
    <li *ngFor="let completedTask of completedTasks" class="list-group-item d-flex justify-content-between align-items-center">
      {{ completedTask }}
      <button class="btn btn-danger" (click)="deleteCompletedTask(completedTask)">Delete</button>
    </li>
  </ul>
</div>
