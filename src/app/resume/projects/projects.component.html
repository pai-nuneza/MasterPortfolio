<section id="works" class="page-60 py-5 glassy">
  <div class="container">
    <div class="section-title">
      <h2 class="text-xl md:text-2xl lg:text-3xl">Featured Projects</h2>
    </div>

    <!-- Swiper Container -->
    <swiper-container class="mySwiper" slides-per-view="1" space-between="20" pagination="{
                        'el': '.swiper-pagination',
                        'clickable': true
                      }" breakpoints='{
                        "640": { "slidesPerView": 2, "spaceBetween": 20 },
                        "768": { "slidesPerView": 3, "spaceBetween": 40 },
                        "1024": { "slidesPerView": 4, "spaceBetween": 60 }
                      }'>

      <swiper-slide *ngFor="let item of items">
        <a target="_blank" href="{{ item.link }}" class="card border-0 rounded-3 overflow-hidden shadow-sm text-dark">
          <div class="position-relative">
            <img src="{{ item.imgLink }}" alt="Card image" class="card-img" />
            <div class="card-img-overlay d-flex flex-column justify-content-between bg-black bg-opacity-50 p-3">
              <div>
                <h1 class="text-lg md:text-xl lg:text-2xl fw-bold text-white">{{ item.title }}</h1>
                <p class="text-white">{{ item.tech }}</p>
              </div>
            </div>
          </div>
        </a>
      </swiper-slide>

    </swiper-container>
  </div>

</section>
