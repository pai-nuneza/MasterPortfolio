<section id="works" class="page-60 py-5 glassy">
  <div class="container">
    <div class="section-title">
      <h2>Featured Projects</h2>
    </div>
    <swiper-container class="mySwiper" slides-per-view="3" space-between="100">
      <swiper-slide *ngFor="let item of items">
        <a target="_blank" href="{{ item.link }}" class="card border-0 rounded-3 overflow-hidden shadow-sm text-dark">
          <div class="position-relative">
            <img src="{{ item.imgLink }}" alt="Card image" class="card-img" />
            <div class="card-img-overlay d-flex flex-column justify-content-between bg-black bg-opacity-25 p-3">
              <h1 class="fs-4 fw-bold text-white text-capitalize">{{ item.title }}</h1>
              <h4 class="text-white">{{ item.tech }}</h4>
            </div>
          </div>
        </a>
      </swiper-slide>
    </swiper-container>
  </div>
</section>
