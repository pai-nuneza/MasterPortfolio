<section id="projects" class="page-60 py-5 glassy">
  <div class="container">
    <div class="section-title">
      <h2>My Works</h2>
    </div>
    <div>
      <div class="row">
        <div class="col-sm-6" *ngFor="let item of items">
          <div class="card bg-transparent glassy my-2">
            <div class="card-body">
              <h5 class="card-title">{{ item.title }}</h5>
              <p class="card-text">{{ item.text }}</p>
              <a href="#" class="btn btn-primary">{{ item.buttonText }}</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
