<section id="works" class="py-5">
  <div class="container">
    <div class="styled-section">
      <div class="section-title text-center mb-5">
        <h2 class="text-xl md:text-2xl lg:text-3xl mb-2" style="color: #00cba9;">Worked Projects</h2>
        <p class="text-white-50 mb-0">A showcase of my professional work and contributions</p>
      </div>

      <!-- Projects Grid -->
      <div class="projects-grid">
        <div class="project-card" *ngFor="let item of items" (click)="viewProject(item.id, $event)">
          <div class="project-card-image-wrapper">
            <img src="{{ item.imgLink }}" alt="{{ item.title }}" class="project-card-img" />
            <div class="project-card-overlay">
              <div class="overlay-content">
                <i class="fas fa-eye overlay-icon"></i>
                <p class="overlay-text">View Project</p>
              </div>
            </div>
          </div>
          <div class="project-card-content">
            <h4 class="project-title">{{ item.title }}</h4>
            <p class="project-description">{{ item.text }}</p>
            <div class="project-tech">
              <i class="fas fa-code me-1"></i>
              <small>{{ item.tech }}</small>
            </div>
            <div class="project-card-footer">
              <span class="view-details-btn">
                <i class="fas fa-arrow-right me-1"></i>View Details
              </span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
