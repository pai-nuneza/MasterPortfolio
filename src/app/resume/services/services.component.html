<section id="services" class="py-5 glassy">
    <div class="container">
        <div class="section-title">
            <h2>I can do</h2>
        </div>
        <ul class="list-unstyled">
            <li *ngFor="let service of services" class="d-flex align-items-start my-3">
                <div class="icon me-3">
                    <i [ngClass]="service.icon + ' fa-lg'"></i>
                </div>
                <div class="content">
                    <h4 class="title">
                        <a class="text-decoration-none text-info" href="">
                            <b>{{ service.title }}</b>
                        </a>
                    </h4>
                </div>
            </li>
        </ul>
    </div>
</section>
