<section id="services" class="page-60 py-5">
    <div class="container">
        <div class="section-title">
            <h2>My Services</h2>
        </div>
        <div>
            <section id="services">
                <div class="container" data-aos="fade-up">
                    <div class="row">
                        <div class="col-lg-4 col-md-6 box my-3" *ngFor="let service of services" data-aos="fade-up"
                            [attr.data-aos-delay]="service.delay">
                            <div class="icon mx-4">
                                <i [ngClass]="service.icon + ' fa-lg'"></i>
                            </div>
                            <div class="content">
                                <h4 class="title"><a class="text-decoration-none text-info" href=""><b>{{ service.title }}</b></a></h4>
                                <p class="description">{{ service.description }}</p>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </div>
</section>
