<!-- ======= Contact Section ======= -->
<section id="contact" class="contact py-5">
  <div class="container my-5">
    <div class="styled-section">
    <div class="section-title">
      <h2>Book A Call</h2>
      <p class="lead">
        If you're interested in creating something great, feel free to reach out
        to me. I'd be happy to collaborate!
      </p>
    </div>
    <div>
      <div class="calendly-placeholder">
        <div class="contact-inline-fields mb-3">
          <input class="form-input" type="text" placeholder="Your name" [(ngModel)]="name" />
          <textarea class="form-input" rows="3" placeholder="Short message" [(ngModel)]="message"></textarea>
          <a class="btn-primary-custom mt-2" [href]="mailtoHref" title="Open your email client to send a message">
            <i class="fas fa-envelope me-2"></i>
            <span>Send Email</span>
          </a>
        </div>
      </div>
    </div>
    </div>
  </div>
</section>
