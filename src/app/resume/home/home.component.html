<section id="home" class="hero-section">
  <div class="container" data-aos="fade-up">
    <div class="row align-items-center min-vh-80">
      <div class="col-12">
        <div class="hero-content">
          <h2 class="hero-title" data-aos="fade-right" data-aos-delay="150">
            Senior Software <span class="gradient-text">Developer</span>
          </h2>

          <h1 class="hero-name" data-aos="fade-right" data-aos-delay="150">
            Ramer Pailou Nuñeza
          </h1>

          <p class="hero-tagline" data-aos="fade-right" data-aos-delay="250">
            I help businesses modernize systems, optimize APIs, and deliver maintainable web applications.
          </p>

          <div class="tech-stack-inline" data-aos="fade-right" data-aos-delay="300">
            <div class="tech-icons-list">
              <div class="tech-icon-item" *ngFor="let tech of techStack" [title]="tech.name">
                <img [src]="tech.icon" [alt]="tech.name" />
                <span>{{ tech.name }}</span>
              </div>
            </div>
          </div>

          <div class="hero-stats hero-stats-mobile d-lg-none" data-aos="fade-right" data-aos-delay="350">
            <div class="stat-item">
              <div class="stat-number">10+</div>
              <div class="stat-label">Years Experience</div>
            </div>
            <div class="stat-divider"></div>

            <div class="stat-item">
              <div class="stat-number">Fullstack</div>
              <div class="stat-label">API & Systems</div>
            </div>
            <div class="stat-divider"></div>

            <div class="stat-item">
              <div class="stat-number">AI-Ready</div>
              <div class="stat-label">Prompt Engineering</div>
            </div>
          </div>

          <div class="hero-ctas" data-aos="fade-right" data-aos-delay="350">
            <a class="btn-primary-custom" href="#works">
              <i class="fas fa-folder-open me-2"></i>
              <span>Explore Projects</span>
            </a>
            <a
              target="_blank"
              class="btn-secondary-custom"
              href="https://drive.google.com/file/d/1VDXAc-70PId4-AtEA9E97e3-TipEBl9H/view?usp=sharing">
              <i class="fas fa-file-download me-2"></i>
              <span>View Resume</span>
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>

<app-projects></app-projects>
<app-about></app-about>
<app-experience></app-experience>
<app-contact-me></app-contact-me>
