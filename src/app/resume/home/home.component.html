<div >

  <section id="home" class="d-flex justify-content-center align-items-center">
    <div class="container">
      <div class="row">
        <div class="col-md-6">
          <h3>Hello, It's Me</h3>
          <p id="home-name">Pai Nuñeza</p>
          <p class="lead">Fullstack .NET/Angular Developer</p>
          <div>
            <div
              id="typedjs"
              style="height: 30px; width: 330px; background-color: #b30a0a"
            >
              <ngx-typed-js
                [strings]="strings"
                [loop]="true"
                [typeSpeed]="10"
                [shuffle]="true"
              >
                <p id="home-typing" class="typing"></p>
              </ngx-typed-js>
            </div>
          </div>
          <div style="margin-top: 50px"></div>
          <div class="social-media">
            <a href="https://www.linkedin.com/in/pailoununeza/" class="me-2"
              ><i class="bx bxl-linkedin-square text-light"></i
            ></a>
            <a href="https://www.facebook.com/pailoununeza/" class="me-2"
              ><i class="bx bxl-facebook-square text-light"></i
            ></a>
            <a href="https://github.com/pai-nuneza" class="me-2"
              ><i class="bx bxl-github text-light"></i
            ></a>
          </div>
          <a
            href="assets/resume.pdf"
            target="_blank"
            class="btn btn-outline-info my-3"
            >Download CV</a
          >
        </div>
        <div class="col-md-6 d-flex justify-content-center align-items-center">
          <div class="home-img"></div>
        </div>
      </div>
    </div>
  </section>
  <app-about-me></app-about-me>
  <app-skills></app-skills>
  <app-experience></app-experience>
  <app-services></app-services>
  <app-projects></app-projects>
  <app-contact-me></app-contact-me>
</div>
