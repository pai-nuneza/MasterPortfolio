
<section
  id="home"
  class="d-flex justify-content-center align-items-center"
>
  <div class="container" style="margin-top:-400px">
    <p id="home-name">Pai Nuñeza</p>
    <p class="lead">Fullstack .NET/Angular Developer</p>
    <div>
      <div id="typedjs" style="height:30px;width:330px;background-color:#b30a0a;">
        <ngx-typed-js
          [strings]="strings"
          [loop]="true"
          [typeSpeed]="10"
          [shuffle]="true"
        >
          <p id="home-typing" class="typing"></p>
        </ngx-typed-js>
      </div>
    </div>

  </div>
</section>
