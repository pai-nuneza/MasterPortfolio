<section id="skills-page" class="py-5">
  <div class="container">
    <div class="styled-section">
      <div class="section-title text-center mb-5">
        <h2 class="text-xl md:text-2xl lg:text-3xl mb-2" style="color: #00cba9;">
          <i class="fas fa-code me-2"></i>Technical Skills
        </h2>
        <p class="text-white-50 mb-0">Main technologies I use across frontend, backend, database, and deployment work</p>
      </div>

      <div class="skills-grid">
        <div class="skill-item" *ngFor="let skill of skills">
          <img [src]="skill.icon" [alt]="skill.name" class="skill-icon">
          <span>{{ skill.name }}</span>
        </div>
      </div>
    </div>
  </div>
</section>
