<section id="experience" class="page-85">
  <div class="container">
    <div class="section-title">
      <h2>Experiences</h2>
    </div>

    <div class="row" *ngFor="let a of experiences; let i = index">
      <div class="col my-3">
        <div class="card border-0 bg-transparent glassy-effect">
          <div class="card-body">
            <div>{{ a.date }}</div>
            <hr />
            <a class="float-end" href="{{ a.companyWebsite }}"
              ><img class="imgsize" src="{{ a.imageUrl }}" />
            </a>
            <h5 class="card-title">{{ a.position }} at {{ a.company }}</h5>
            <p class="card-text">{{ a.description }}</p>

            <!-- Tech:
            <span
              *ngFor="let n of a.technologies; let i = index"
              class="badge bg-primary"
              style="margin-right:2px;"
              >{{ n }}</span
            > -->
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
