<section id="experience" class="full-page my-5">
  <div class="container">
    <div class="section-title">
      <h2>Experiences</h2>
    </div>


    <div class="row" *ngFor="let a of experiences; let i = index">
      <!-- timeline item 1 event content -->
      <div class="col py-2">
        <div class="card bg-secondary">
          <div class="card-body">
            <div class="float-end">{{a.date}}</div>
            <h5 class="card-title">{{a.position}}</h5>
            <p> at {{a.company}}</p>
            <p class="card-text">{{a.description}}</p>
            <hr>
          </div>
        </div>
      </div>
    </div>

    <!--/row-->
  </div>
</section>
