<section id="experience" class="page-75 my-5">
  <div class="container">
    <div class="section-title">
      <h2>Experiences</h2>
    </div>


    <div class="row" *ngFor="let a of experiences; let i = index">
      <div class="col my-3">
        <div class="card bg-secondary">
          <div class="card-body">
            <div class="float-end">{{a.date}}</div>
            <a href="{{a.companyWebsite}}"><img class="imgsize" src="{{a.imageUrl}}"> </a>
            <h5 class="card-title">   {{a.position}}</h5>
            <p> at {{a.company}} </p>

            <p class="card-text">{{a.description}}</p>
            <hr>
            Technologies:
            <span *ngFor="let n of a.technologies; let i = index" class="badge mx-1 bg-primary">{{n}}</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
