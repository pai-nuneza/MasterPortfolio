<section
  id="home"
  class="d-flex justify-content-center align-items-center vh-100"
>
  <div class="container text-center">
    <p id="home-name">Pai Nuñeza</p>
    <p class="lead">Fullstack Developer at Unient</p>
    <div class="mb-5">
      <ngx-typed-js
        [strings]="strings"
        [loop]="true"
        [typeSpeed]="10"
        [shuffle]="true"
      >
        <p id="home-typing" class="typing"></p>
      </ngx-typed-js>
    </div>
  </div>
</section>
